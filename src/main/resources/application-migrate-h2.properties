# Migration one-shot H2 (fichier) → MySQL
# Usage : mvn spring-boot:run -Dspring-boot.run.profiles=dev,migrate-h2
#
# Prérequis : fichier ./data/doctoratdb.mv.db existant (profil h2 utilisé au moins une fois)
# Sinon les données seront recréées par DemoDataInitializer au démarrage MySQL.

app.migration.h2-to-mysql.enabled=true
app.migration.h2.file=./data/doctoratdb
