<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<body>

<nav th:fragment="navbar"
     class="navbar navbar-portal navbar-expand-lg fixed-top d-flex align-items-center">

    <div class="container-fluid">

        <a class="navbar-brand" th:href="@{/}">
            <div class="d-flex align-items-center gap-2">
                <div class="navbar-brand-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <span class="d-none d-sm-inline">Portail Doctorat</span>
            </div>
        </a>

        <button class="btn btn-sidebar-toggle d-lg-none me-2" type="button" id="sidebarToggle" aria-label="Menu">
            <i class="fas fa-bars"></i>
        </button>

        <div class="d-flex align-items-center gap-3 ms-auto">

            <a th:href="@{/notifications}" class="nav-link position-relative"
               data-bs-toggle="tooltip" data-bs-placement="bottom" title="Notifications">
                <i class="fas fa-bell"></i>
                <span th:if="${notificationsCount != null and notificationsCount > 0}"
                      class="navbar-notification-badge"
                      th:text="${notificationsCount}">3</span>
            </a>

            <div class="d-flex align-items-center gap-2">
                <div class="navbar-user-avatar">
                    <span th:if="${connectedUser != null}"
                          th:text="${connectedUser.prenom != null ? connectedUser.prenom.substring(0,1) : ''} + ${connectedUser.nom != null ? connectedUser.nom.substring(0,1) : ''}">AD</span>
                    <span th:unless="${connectedUser != null}">?</span>
                </div>
                <div class="d-none d-md-block">
                    <div class="navbar-user-name"
                         th:if="${connectedUser != null}"
                         th:text="${connectedUser.prenom + ' ' + connectedUser.nom}">Utilisateur</div>
                    <div class="navbar-user-role"
                         th:if="${connectedUser != null}"
                         th:text="${connectedUser.role}">ROLE</div>
                </div>
            </div>

            <form th:action="@{/logout}" method="post" class="d-inline mb-0">
                <button type="submit" class="btn btn-logout" data-bs-toggle="tooltip"
                        data-bs-placement="bottom" title="Se déconnecter">
                    <i class="fas fa-sign-out-alt me-1 d-none d-sm-inline"></i>
                    <span class="d-none d-sm-inline">Déconnexion</span>
                    <i class="fas fa-sign-out-alt d-sm-none"></i>
                </button>
            </form>

        </div>

    </div>

</nav>

</body>
</html>
