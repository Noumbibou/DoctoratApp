<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portail de Gestion des Doctorats — Gestion des inscriptions, publications, formations et soutenances.">
    <title layout:title-pattern="$CONTENT_TITLE — Portail Doctorat">Portail de Gestion des Doctorats</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/1RQnVOft6v3FMhOSLAUKk9bCbHJlxV"
          crossorigin="anonymous">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          rel="stylesheet"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">

    <link th:href="@{/css/style.css?v=7}" rel="stylesheet">
</head>
<body th:classappend="${connectedUser != null and connectedUser.role != null and connectedUser.role.name() == 'CANDIDAT'} ? 'portal-candidat' : (${connectedUser != null and connectedUser.role != null and connectedUser.role.name() == 'DIRECTEUR'} ? 'portal-directeur' : '')">

    <div th:replace="~{layout/navbar :: navbar}"></div>

    <div class="container-fluid p-0">
        <div class="d-flex">

            <div th:replace="~{layout/sidebar :: sidebar}"></div>

            <main class="main-content flex-grow-1" id="mainContent">

                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${successMessage}">Opération réussie.</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${errorMessage}">Une erreur est survenue.</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
                </div>

                <section layout:fragment="content"></section>

            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

    <script th:src="@{/js/main.js?v=5}"></script>

    <th:block layout:fragment="scripts"></th:block>

</body>
</html>
