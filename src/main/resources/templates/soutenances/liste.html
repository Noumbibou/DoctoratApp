<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="fr">
<head>
    <title>Soutenances</title>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     SOUTENANCES — LISTE (ADMIN)
     URL : GET /soutenances
     Rôle: ADMIN
     ═══════════════════════════════════════════════════════════ -->
<section layout:fragment="content">

    <!-- ── Page Header ───────────────────────────────────── -->
    <div class="page-header d-flex flex-wrap align-items-center justify-content-between mb-4">
        <div>
            <h1>
                <i class="fas fa-university me-2" style="color:var(--primary); font-size:1.25rem;"></i>
                Gestion des soutenances
            </h1>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/main/resources/static}">Accueil</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Soutenances</li>
                </ol>
            </nav>
        </div>
    </div>

    <!-- ── Filtre par statut ─────────────────────────────── -->
    <div class="card mb-4">
        <div class="card-body py-3">
            <form th:action="@{/soutenances}" method="get" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="filterStatut" class="form-label fw-semibold" style="font-size:0.8125rem;">
                        <i class="fas fa-filter me-1"></i> Filtrer par statut
                    </label>
                    <select class="form-select" id="filterStatut" name="statut">
                        <option value="">Tous les statuts</option>
                        <option value="DEMANDEE" th:selected="${param.statut != null and param.statut == 'DEMANDEE'}">Demandée</option>
                        <option value="AUTORISEE" th:selected="${param.statut != null and param.statut == 'AUTORISEE'}">Autorisée</option>
                        <option value="PLANIFIEE" th:selected="${param.statut != null and param.statut == 'PLANIFIEE'}">Planifiée</option>
                        <option value="TERMINEE" th:selected="${param.statut != null and param.statut == 'TERMINEE'}">Terminée</option>
                        <option value="REJETEE" th:selected="${param.statut != null and param.statut == 'REJETEE'}">Rejetée</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-outline-primary w-100">
                        <i class="fas fa-search me-1"></i> Filtrer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ── Tableau des soutenances ────────────────────────── -->
    <div class="card" id="soutenancesListCard">
        <div class="card-header d-flex align-items-center justify-content-between">
            <span>
                <i class="fas fa-list me-2" style="color:var(--primary);"></i>
                Liste des soutenances
            </span>
            <span class="badge rounded-pill"
                  style="background:rgba(var(--primary-rgb),0.1); color:var(--primary); font-size:0.75rem;"
                  th:text="${soutenances != null ? soutenances.size() + ' soutenance(s)' : '0 soutenance(s)'}">0</span>
        </div>
        <div class="card-body p-0">

            <div th:if="${soutenances != null and !soutenances.empty}">
                <div class="table-responsive">
                    <table class="table table-portal mb-0">
                        <thead>
                            <tr>
                                <th>Doctorant</th>
                                <th>Sujet</th>
                                <th>Date dépôt</th>
                                <th>Statut</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="soutenance : ${soutenances}">
                                <!-- Doctorant -->
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div style="width:36px; height:36px; border-radius:50%;
                                                    background:linear-gradient(135deg, var(--primary), #2980B9);
                                                    display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                                            <span style="color:#fff; font-weight:600; font-size:0.75rem;"
                                                  th:text="${soutenance.doctorantNom != null ? soutenance.doctorantNom.substring(0,1) : 'D'}">D</span>
                                        </div>
                                        <div class="ms-2">
                                            <div class="fw-semibold" style="font-size:0.875rem;"
                                                 th:text="${soutenance.doctorantNom != null ? soutenance.doctorantNom : 'Doctorant'}">Nom</div>
                                        </div>
                                    </div>
                                </td>
                                <!-- Sujet -->
                                <td style="max-width:220px;">
                                    <span style="font-size:0.875rem;" th:text="${soutenance.sujetThese}"
                                          th:title="${soutenance.sujetThese}">Sujet</span>
                                </td>
                                <!-- Date dépôt -->
                                <td>
                                    <span style="font-size:0.875rem;"
                                          th:text="${soutenance.dateDepot != null ? #temporals.format(soutenance.dateDepot, 'dd/MM/yyyy') : '—'}">01/01/2026</span>
                                </td>
                                <!-- Statut badge -->
                                <td>
                                    <span class="badge-statut"
                                          th:classappend="${
                                              soutenance.statut == 'DEMANDEE'  ? 'badge-SOUMIS' :
                                              soutenance.statut == 'AUTORISEE' ? 'badge-VALIDE' :
                                              soutenance.statut == 'PLANIFIEE' ? 'badge-ACTIF' :
                                              soutenance.statut == 'TERMINEE'  ? 'badge-DIPLOME' :
                                              soutenance.statut == 'REJETEE'   ? 'badge-REJETE' :
                                              'badge-SOUMIS'}"
                                          th:text="${soutenance.statut}">DEMANDEE</span>
                                </td>
                                <!-- Actions -->
                                <td class="text-center">
                                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                                        <!-- Voir détail -->
                                        <a th:href="@{/soutenances/{id}(id=${soutenance.id})}"
                                           class="btn btn-sm btn-outline-primary"
                                           data-bs-toggle="tooltip" title="Voir détail">
                                            <i class="fas fa-eye me-1"></i>Détail
                                        </a>
                                        <!-- Autoriser (only if DEMANDEE) -->
                                        <form th:if="${soutenance.statut == 'DEMANDEE'}"
                                              th:action="@{/soutenances/{id}/autoriser(id=${soutenance.id})}"
                                              method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-success"
                                                    data-bs-toggle="tooltip" title="Autoriser la soutenance">
                                                <i class="fas fa-check me-1"></i>Autoriser
                                            </button>
                                        </form>
                                        <!-- Planifier (only if AUTORISEE) -->
                                        <a th:if="${soutenance.statut == 'AUTORISEE'}"
                                           th:href="@{/soutenances/{id}/planifier(id=${soutenance.id})}"
                                           class="btn btn-sm btn-outline-warning"
                                           data-bs-toggle="tooltip" title="Planifier la soutenance">
                                            <i class="fas fa-calendar-alt me-1"></i>Planifier
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Empty state -->
            <div th:unless="${soutenances != null and !soutenances.empty}" class="text-center py-5">
                <div style="width:64px; height:64px; border-radius:50%; background:rgba(var(--primary-rgb),0.08);
                            display:flex; align-items:center; justify-content:center; margin:0 auto 1rem;">
                    <i class="fas fa-university" style="font-size:1.5rem; color:var(--primary);"></i>
                </div>
                <h6 class="fw-semibold text-muted">Aucune soutenance</h6>
                <p class="text-muted mb-0" style="font-size:0.8125rem;">Aucune demande de soutenance n'a été soumise.</p>
            </div>

        </div>
    </div>

</section>

</body>
</html>
