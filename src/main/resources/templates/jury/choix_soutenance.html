<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="fr">
<head>
    <title>Sélectionner la Soutenance — Jury</title>
</head>
<body>

<section layout:fragment="content">

    <!-- ── Page Header ───────────────────────────────────── -->
    <div class="page-header d-flex flex-wrap align-items-center justify-content-between mb-4">
        <div>
            <h1>
                <i class="fas fa-users me-2" style="color:var(--primary); font-size:1.25rem;"></i>
                Gestion des Jurys
            </h1>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/}">Accueil</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Choix de la soutenance</li>
                </ol>
            </nav>
        </div>
    </div>

    <!-- ══════════════════════════════════════════════════════
         TABLEAU DES SOUTENANCES
         ══════════════════════════════════════════════════════ -->
    <div class="card">
        <div class="card-header d-flex align-items-center justify-content-between">
            <span>
                <i class="fas fa-list me-2" style="color:var(--primary);"></i>
                Soutenances supervisées
            </span>
            <span class="badge rounded-pill"
                  style="background:rgba(var(--primary-rgb),0.1); color:var(--primary); font-size:0.75rem;"
                  th:text="${demandes != null ? demandes.size() + ' soutenance(s)' : '0'}">0</span>
        </div>
        <div class="card-body p-0">

            <div th:if="${demandes != null and !demandes.empty}">
                <div class="table-responsive">
                    <table class="table table-portal mb-0">
                        <thead>
                            <tr>
                                <th>Doctorant</th>
                                <th>Sujet de thèse</th>
                                <th>Statut Demande</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="demande : ${demandes}">
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div style="width:36px; height:36px; border-radius:50%;
                                                    background:linear-gradient(135deg, var(--primary), #2980B9);
                                                    display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                                            <span style="color:#fff; font-weight:600; font-size:0.75rem;"
                                                  th:text="${demande.doctorantNom != null ? demande.doctorantNom.substring(0,1) : 'D'}">D</span>
                                        </div>
                                        <div class="ms-2">
                                            <div class="fw-semibold" style="font-size:0.875rem;"
                                                 th:text="${demande.doctorantNom}">Nom Prénom</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span style="font-size:0.875rem;" th:text="${demande.sujetThese}">Sujet</span>
                                </td>
                                <td>
                                    <span class="badge rounded-pill"
                                          th:style="${
                                              demande.statut == 'SOUMIS'  ? 'background:rgba(52,152,219,0.12); color:#2980B9;' :
                                              demande.statut == 'AUTORISEE' ? 'background:rgba(46,204,113,0.12); color:#27AE60;' :
                                              demande.statut == 'PLANIFIEE' ? 'background:rgba(241,196,15,0.12); color:#D4AC0D;' :
                                              'background:rgba(127,140,141,0.12); color:#7F8C8D;'}"
                                          th:text="${demande.statut}">Statut</span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/jury/soutenance/{id}(id=${demande.id})}"
                                       class="btn btn-sm btn-outline-primary">
                                        <i class="fas fa-users-cog me-1"></i> Gérer le jury
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Empty state -->
            <div th:unless="${demandes != null and !demandes.empty}" class="text-center py-5">
                <div style="width:64px; height:64px; border-radius:50%; background:rgba(var(--primary-rgb),0.08);
                            display:flex; align-items:center; justify-content:center; margin:0 auto 1rem;">
                    <i class="fas fa-university" style="font-size:1.5rem; color:var(--primary);"></i>
                </div>
                <h6 class="fw-semibold text-muted">Aucune demande de soutenance</h6>
                <p class="text-muted mb-0" style="font-size:0.8125rem;">
                    Il n'y a actuellement aucune demande de soutenance nécessitant la désignation d'un jury.
                </p>
            </div>

        </div>
    </div>

</section>

</body>
</html>
