<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="fr">
<head>
    <title>Sélectionner la Soutenance — Jury</title>
</head>
<body>

<section layout:fragment="content">

    <div class="page-header">
        <h1>
            <span class="page-title-icon"><i class="fas fa-users-cog"></i></span>
            Gestion des jurys
        </h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="@{/dashboard/directeur}">Accueil</a></li>
                <li class="breadcrumb-item active" aria-current="page">Choix de la soutenance</li>
            </ol>
        </nav>
    </div>

    <div class="card">
        <div class="card-header">
            <span class="card-header-title">
                <i class="fas fa-list"></i>
                Soutenances supervisées
            </span>
            <span class="badge-count"
                  th:text="${demandes != null ? demandes.size() + ' soutenance(s)' : '0'}">0</span>
        </div>
        <div class="card-body p-0">

            <div th:if="${demandes != null and !demandes.empty}">
                <div class="table-responsive">
                    <table class="table table-portal mb-0">
                        <thead>
                            <tr>
                                <th>Doctorant</th>
                                <th>Sujet de thèse</th>
                                <th>Statut demande</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="demande : ${demandes}">
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="avatar candidat"
                                             th:text="${demande.doctorantNom != null ? demande.doctorantNom.substring(0,1) : 'D'}">D</div>
                                        <span class="fw-semibold" th:text="${demande.doctorantNom}">Nom</span>
                                    </div>
                                </td>
                                <td th:text="${demande.sujetThese}">Sujet</td>
                                <td>
                                    <span class="badge-statut"
                                          th:classappend="${
                                              demande.statut == 'SOUMIS'    ? 'badge-SOUTENANCE-SOUMIS' :
                                              demande.statut == 'AUTORISEE' ? 'badge-SOUTENANCE-AUTORISEE' :
                                              demande.statut == 'PLANIFIEE'  ? 'badge-SOUTENANCE-PLANIFIEE' :
                                              'badge-SOUMIS'}"
                                          th:text="${demande.statut}">Statut</span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/jury/soutenance/{id}(id=${demande.id})}"
                                       class="btn btn-sm btn-outline-primary">
                                        <i class="fas fa-users-cog me-1"></i> Gérer le jury
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div th:unless="${demandes != null and !demandes.empty}" class="empty-state">
                <div class="empty-state-icon">
                    <i class="fas fa-university"></i>
                </div>
                <h6>Aucune demande de soutenance</h6>
                <p class="mb-0">Aucune soutenance ne nécessite actuellement la désignation d'un jury.</p>
            </div>

        </div>
    </div>

</section>

</body>
</html>
