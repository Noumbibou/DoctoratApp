<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="fr">
<head>
    <title>Ajouter un Membre du Jury</title>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     JURY — FORMULAIRE
     URL : GET /jury/nouveau/{soutenanceId} | POST /jury/nouveau
     Rôle: DIRECTEUR
     ═══════════════════════════════════════════════════════════ -->
<section layout:fragment="content">

    <!-- ── Page Header ───────────────────────────────────── -->
    <div class="page-header mb-4">
        <h1>
            <i class="fas fa-user-plus me-2" style="color:var(--primary); font-size:1.25rem;"></i>
            Ajouter un membre
        </h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="@{/}">Accueil</a></li>
                <li class="breadcrumb-item"><a th:href="@{/soutenances}">Soutenances</a></li>
                <li class="breadcrumb-item active" aria-current="page">Nouveau membre</li>
            </ol>
        </nav>
    </div>

    <!-- ══════════════════════════════════════════════════════
         FORMULAIRE
         ══════════════════════════════════════════════════════ -->
    <div class="card" id="juryFormCard">
        <div class="card-header">
            <i class="fas fa-id-card me-2" style="color:var(--primary);"></i>
            Informations du membre
        </div>
        <div class="card-body">

            <form th:action="@{/jury/nouveau}" method="post"
                  class="needs-validation" novalidate id="juryForm">

                <!-- Hidden input for soutenance ID if needed -->
                <input type="hidden" name="soutenanceId" th:value="${soutenanceId}">

                <div class="row g-4">

                    <!-- ── Nom ────────────────────────────── -->
                    <div class="col-md-6">
                        <label for="nom" class="form-label fw-semibold">
                            Nom <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="nom" name="nom"
                               placeholder="Ex : Dupont" required>
                        <div class="invalid-feedback">Le nom est obligatoire.</div>
                    </div>

                    <!-- ── Prénom ─────────────────────────── -->
                    <div class="col-md-6">
                        <label for="prenom" class="form-label fw-semibold">
                            Prénom <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="prenom" name="prenom"
                               placeholder="Ex : Jean" required>
                        <div class="invalid-feedback">Le prénom est obligatoire.</div>
                    </div>

                    <!-- ── Grade ──────────────────────────── -->
                    <div class="col-md-6">
                        <label for="grade" class="form-label fw-semibold">
                            Grade <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="grade" name="grade"
                               placeholder="Ex : Professeur de l'Enseignement Supérieur" required>
                        <div class="invalid-feedback">Le grade est obligatoire.</div>
                    </div>

                    <!-- ── Établissement ──────────────────── -->
                    <div class="col-md-6">
                        <label for="etablissement" class="form-label fw-semibold">
                            Établissement <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="etablissement" name="etablissement"
                               placeholder="Ex : Université Mohammed V" required>
                        <div class="invalid-feedback">L'établissement est obligatoire.</div>
                    </div>

                    <!-- ── Rôle ───────────────────────────── -->
                    <div class="col-md-12">
                        <label for="role" class="form-label fw-semibold">
                            Rôle dans le jury <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="">— Sélectionner un rôle —</option>
                            <option value="RAPPORTEUR">Rapporteur</option>
                            <option value="EXAMINATEUR">Examinateur</option>
                            <option value="PRESIDENT">Président</option>
                        </select>
                        <div class="invalid-feedback">Veuillez sélectionner le rôle du membre.</div>
                    </div>

                </div>

                <!-- ── Buttons ───────────────────────────── -->
                <div class="d-flex justify-content-between align-items-center pt-4 mt-2"
                     style="border-top:1px solid var(--border-color);">
                    <a th:href="@{/jury/soutenance/{id}(id=${soutenanceId})}" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-1"></i> Annuler
                    </a>
                    <button type="submit" class="btn btn-primary" id="submitJury">
                        <i class="fas fa-check me-1"></i> Ajouter au jury
                    </button>
                </div>

            </form>

        </div>
    </div>

</section>

<!-- ── Page-specific scripts ─────────────────────────────── -->
<th:block layout:fragment="scripts">
<script>
document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('juryForm');
    if (form) {
        form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        }, false);
    }
});
</script>
</th:block>

</body>
</html>
