<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="fr">
<head>
    <title>Ajouter un Membre du Jury</title>
</head>
<body>

<section layout:fragment="content">

    <div class="page-header mb-4">
        <h1>
            <span class="page-title-icon"><i class="fas fa-user-plus"></i></span>
            Ajouter un membre
        </h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="@{/dashboard/directeur}">Accueil</a></li>
                <li class="breadcrumb-item"><a th:href="@{/jury/soutenance/{id}(id=${soutenanceId})}">Jury</a></li>
                <li class="breadcrumb-item active" aria-current="page">Nouveau membre</li>
            </ol>
        </nav>
    </div>

    <div class="card" id="juryFormCard">
        <div class="card-header">
            <span class="card-header-title">
                <i class="fas fa-id-card"></i>
                Informations du membre
            </span>
        </div>
        <div class="card-body">

            <form th:action="@{/jury/nouveau}" method="post"
                  class="needs-validation" novalidate id="juryForm">

                <input type="hidden" name="soutenanceId" th:value="${soutenanceId}">

                <div class="row g-4">
                    <div class="col-md-6">
                        <label for="nom" class="form-label">Nom <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nom" name="nom"
                               placeholder="Ex : Dupont" required>
                        <div class="invalid-feedback">Le nom est obligatoire.</div>
                    </div>
                    <div class="col-md-6">
                        <label for="prenom" class="form-label">Prénom <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="prenom" name="prenom"
                               placeholder="Ex : Jean" required>
                        <div class="invalid-feedback">Le prénom est obligatoire.</div>
                    </div>
                    <div class="col-md-6">
                        <label for="grade" class="form-label">Grade <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="grade" name="grade"
                               placeholder="Ex : Professeur" required>
                        <div class="invalid-feedback">Le grade est obligatoire.</div>
                    </div>
                    <div class="col-md-6">
                        <label for="etablissement" class="form-label">Établissement <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="etablissement" name="etablissement"
                               placeholder="Ex : Université" required>
                        <div class="invalid-feedback">L'établissement est obligatoire.</div>
                    </div>
                    <div class="col-md-12">
                        <label for="role" class="form-label">Rôle dans le jury <span class="text-danger">*</span></label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="">— Sélectionner un rôle —</option>
                            <option value="RAPPORTEUR">Rapporteur</option>
                            <option value="EXAMINATEUR">Examinateur</option>
                            <option value="PRESIDENT">Président</option>
                        </select>
                        <div class="invalid-feedback">Veuillez sélectionner le rôle du membre.</div>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center form-actions">
                    <a th:href="@{/jury/soutenance/{id}(id=${soutenanceId})}" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-1"></i> Annuler
                    </a>
                    <button type="submit" class="btn btn-primary" id="submitJury">
                        <i class="fas fa-check me-1"></i> Ajouter au jury
                    </button>
                </div>

            </form>

        </div>
    </div>

</section>

<th:block layout:fragment="scripts">
<script>
document.addEventListener('DOMContentLoaded', function () {
    var form = document.getElementById('juryForm');
    if (form) {
        form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        }, false);
    }
});
</script>
</th:block>

</body>
</html>
