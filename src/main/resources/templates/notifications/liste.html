<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="fr">
<head>
    <title>Mes Notifications</title>
</head>
<body>

<section layout:fragment="content">

    <div class="page-header d-flex flex-wrap align-items-center justify-content-between gap-3">
        <div>
            <h1>
                <span class="page-title-icon"><i class="fas fa-bell"></i></span>
                Notifications
            </h1>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item">
                        <a th:href="@{/dashboard/candidat}" th:if="${connectedUser != null and connectedUser.role.name() == 'CANDIDAT'}">Accueil</a>
                        <a th:href="@{/dashboard/directeur}" th:if="${connectedUser != null and connectedUser.role.name() == 'DIRECTEUR'}">Accueil</a>
                        <a th:href="@{/dashboard/admin}" th:if="${connectedUser != null and connectedUser.role.name() == 'ADMIN'}">Accueil</a>
                        <a th:href="@{/}" th:if="${connectedUser == null}">Accueil</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">Notifications</li>
                </ol>
            </nav>
        </div>
        <form th:if="${notifications != null and !notifications.empty}"
              th:action="@{/notifications/touteslues}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-primary">
                <i class="fas fa-check-double me-1"></i> Tout marquer comme lu
            </button>
        </form>
    </div>

    <div class="card" id="notificationsCard">
        <div class="card-body p-0">

            <div th:if="${notifications != null and !notifications.empty}">
                <div th:each="notif : ${notifications}"
                     class="notif-item"
                     th:classappend="${!notif.lue ? 'unread' : ''}">
                    <div class="d-flex align-items-start gap-3">
                        <div class="notif-icon"
                             th:classappend="${
                                 notif.type == 'INFO'           ? 'info' :
                                 notif.type == 'ALERTE'         ? 'alerte' :
                                 notif.type == 'ACTION_REQUISE' ? 'action' : 'info'}">
                            <i th:class="${
                                   notif.type == 'INFO'           ? 'fas fa-info-circle' :
                                   notif.type == 'ALERTE'         ? 'fas fa-exclamation-triangle' :
                                   notif.type == 'ACTION_REQUISE' ? 'fas fa-exclamation-circle' : 'fas fa-bell'}"></i>
                        </div>
                        <div class="flex-grow-1">
                            <div class="d-flex justify-content-between align-items-start gap-2">
                                <h6 class="mb-1 fw-bold" th:text="${notif.titre}">Titre</h6>
                                <small class="text-muted text-nowrap"
                                       th:text="${notif.dateEnvoi != null ? #temporals.format(notif.dateEnvoi, 'dd/MM/yyyy HH:mm') : '—'}">
                                    01/01/2026
                                </small>
                            </div>
                            <p class="mb-2 text-muted small" th:text="${notif.message}">Message</p>
                            <div class="d-flex align-items-center gap-2">
                                <span th:if="${!notif.lue}" class="badge-nouveau">Nouveau</span>
                                <a th:if="${notif.lienRessource != null and notif.lienRessource != ''}"
                                   th:href="@{${notif.lienRessource}}"
                                   class="btn btn-sm btn-outline-primary py-0 px-2 small">
                                    Voir les détails
                                </a>
                            </div>
                        </div>
                        <div th:if="${!notif.lue}" class="flex-shrink-0">
                            <form th:action="@{/notifications/{id}/lue(id=${notif.id})}" method="post">
                                <button type="submit" class="btn btn-sm btn-link text-muted p-0"
                                        data-bs-toggle="tooltip" title="Marquer comme lue">
                                    <i class="fas fa-circle-check" style="font-size:1.2rem;"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div th:unless="${notifications != null and !notifications.empty}" class="empty-state">
                <div class="empty-state-icon">
                    <i class="fas fa-bell-slash"></i>
                </div>
                <h6>Aucune notification</h6>
                <p class="mb-0">Vous êtes à jour. Aucune nouvelle notification pour le moment.</p>
            </div>

        </div>
    </div>

</section>

</body>
</html>
